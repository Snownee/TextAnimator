buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.shedaniel.me/' }
    }
    dependencies {
        classpath 'me.shedaniel:unified-publishing:0.1.13'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

apply plugin: 'me.shedaniel.unified-publishing'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.minecraft_version + "-Neoforge-" + project.mod_version
group = project.mod_group_id
var realVersion = project.mod_version + '+neoforge'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

unifiedPublishing {
    project {
        displayName = "[NeoForge ${project.minecraft_version}] ${project.mod_version}"
        version = realVersion
        changelog = file('CHANGELOG.md').exists() ? file('CHANGELOG.md').text : ''
        releaseType = project.findProperty('release_type') ?: 'release'
        gameVersions = [project.minecraft_version]
        gameLoaders = ['neoforge']

        mainPublication tasks.named('jar').get()

        def cfToken = System.getenv('CURSE_TOKEN')
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = '881778'

                relations {
                }
            }
        }

        def mrToken = System.getenv('MODRINTH_TOKEN')
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = 'HBIG5nRf'

                relations {
                }
            }
        }
    }
}
